version: '3.8'

services:
  backend:
    build: .
    container_name: expense-ai-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: sh -c "cd src && python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: .
    container_name: expense-ai-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_BASE_URL=http://backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: sh -c "cd src && streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
